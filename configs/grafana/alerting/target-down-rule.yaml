apiVersion: 1
groups:
    - orgId: 1
      name: noc-availability
      folder: ""
      interval: 30s
      rules:
        - uid: afzs5lpdu4agwf
          title: TargetDown
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: PBFA97CFB590B2093
              model:
                editorMode: code
                expr: up
                instant: true
                intervalMs: 1000
                legendFormat: __auto
                maxDataPoints: 43200
                range: false
                refId: A
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 1
                        type: lt
                      operator:
                        type: and
                      query:
                        params: []
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: Alerting
          execErrState: Alerting
          for: 1m
          annotations:
            description: Prometheus reports up=0 for {{ $labels.instance }} (job {{ $labels.job }}).
            runbook_url: https://github.com/Nlwhite20/noc-monitoring-lab/blob/main/docs/runbooks/prometheus.md
            summary: '{{ $labels.job }} target down'
          labels:
            severity: warning
          isPaused: false
