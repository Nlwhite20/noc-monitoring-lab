services:
  prometheus:
    image: prom/prometheus:v3.10.0
    container_name: noc-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./configs/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - noc-net
    mem_limit: 1024m
    cpus: 1.0

  node-exporter:
    image: prom/node-exporter:v1.12.1
    container_name: noc-node-exporter
    restart: unless-stopped
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro,rslave
    networks:
      - noc-net
    mem_limit: 256m
    cpus: 0.5

  grafana:
    image: grafana/grafana:12.4.0
    container_name: noc-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./configs/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - noc-net
    mem_limit: 768m
    cpus: 1.0

  uptime-kuma:
    image: louislam/uptime-kuma:2.4.0
    container_name: noc-uptime-kuma
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - uptime-kuma-data:/app/data
    networks:
      - noc-net
    mem_limit: 512m
    cpus: 0.5

  test-web:
    image: nginx:1.28-alpine
    container_name: noc-test-web
    restart: unless-stopped
    networks:
      - noc-net
    mem_limit: 64m
    cpus: 0.25

networks:
  noc-net:
    name: noc-net
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:
  uptime-kuma-data:
